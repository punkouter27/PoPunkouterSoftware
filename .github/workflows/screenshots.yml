name: Capture app screenshots

# The portfolio card is a screenshot, the app name and a status dot — the screenshot IS
# the card. In-process capture is off in Production because the Windows F1 sandbox cannot
# run Chromium (and the install attempt once filled the worker disk, breaking every
# deployment — 2026-07-10), so appsettings.json has said since then that "the screenshots.yml
# GitHub Action captures nightly into the same blob container".
#
# That workflow did not exist. Every production card rendered with screenshotUrl: null.
# This is it: same container, same blob names, same viewport as AppScreenshotService, so the
# two paths are interchangeable and /api/portfolio/screenshots/{host} serves either.
#
# AUTH: uploads with the storage account key, fetched at run time through ARM by the same
# OIDC identity deploy.yml already uses. That identity has Contributor on the resource group
# (it deploys the site), and Contributor covers `listKeys` — so this needs no new grant and
# no new secret, which is the difference between a workflow that runs tonight and one that
# fails nightly until somebody remembers to fix RBAC.
#
# The stricter alternative is `--auth-mode login` plus a "Storage Blob Data Contributor"
# assignment scoped to the container. Prefer it if you know the identity's object id —
# control-plane Contributor already implies the ability to read the account key, so this is
# not a privilege escalation, but a data-plane role is narrower than a key to the whole
# account. The first version of this workflow used `--auth-mode login` with no such
# assignment anywhere, which would have failed on its first run.

on:
  schedule:
    # 04:40 UTC — after the 06:17 uptime scan would be too late for a morning visitor, and
    # far enough from the deploy window that a capture never races a restart.
    - cron: '40 4 * * *'
  workflow_dispatch:

concurrency:
  group: screenshots
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  SITE_URL: 'https://app-popunkoutersoftware2.azurewebsites.net'
  STORAGE_ACCOUNT: 'stpopunkoutersoftware2'
  STORAGE_RG: 'PoPunkouterSoftware'
  CONTAINER: 'app-screenshots'
  # Must match AppScreenshotService's ViewportWidth/ViewportHeight: the cards display the
  # PNG at a fixed aspect ratio, so a different capture size letterboxes every thumbnail.
  VIEWPORT_WIDTH: '390'
  VIEWPORT_HEIGHT: '844'

jobs:
  capture:
    name: Capture & upload
    runs-on: ubuntu-latest
    # 30 for screenshots, plus up to ~15 for PageSpeed Insights (a minute-ish per app).
    timeout-minutes: 45
    environment: production
    steps:
      - name: Setup Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'

      - name: Install Playwright (Chromium only)
        # `npx playwright install` fetches the browser but leaves the package itself in the
        # npx cache, where capture.mjs's `import 'playwright'` cannot resolve it (failed every
        # night until 2026-10-20). Install the package into ./node_modules first.
        run: |
          npm install --no-save playwright@1.49.0
          npx playwright install --with-deps chromium

      # The live portfolio is the source of truth for what has a card, so the capture set
      # cannot drift from the render set. Waking the site first: F1 has no Always-On, and a
      # cold start answers the first request slowly rather than not at all.
      - name: Wake the site
        run: curl -fsS --max-time 180 --retry 3 --retry-all-errors "$SITE_URL/healthz" > /dev/null

      - name: Capture screenshots
        run: |
          mkdir -p shots
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFileSync } from 'node:fs';

          const site = process.env.SITE_URL;
          const width = Number(process.env.VIEWPORT_WIDTH);
          const height = Number(process.env.VIEWPORT_HEIGHT);

          const res = await fetch(`${site}/api/portfolio`);
          if (!res.ok) throw new Error(`portfolio fetch failed: ${res.status}`);
          const { apps } = await res.json();

          // One blob per HOST, lowercased — AppScreenshotService.HostOf's contract, and what
          // /api/portfolio/screenshots/{host} looks up.
          const targets = [];
          for (const app of apps ?? []) {
            if (!app.url) continue;
            try { targets.push({ host: new URL(app.url).host.toLowerCase(), url: app.url }); }
            catch { /* a malformed catalog URL is not worth failing the run over */ }
          }
          console.log(`${targets.length} targets`);
          writeFileSync('targets.json', JSON.stringify(targets));

          const browser = await chromium.launch();
          let captured = 0;
          for (const { host, url } of targets) {
            const page = await browser.newPage({
              viewport: { width, height },
              isMobile: true,
              hasTouch: true,
              deviceScaleFactor: 2,
            });
            try {
              // Cold Azure apps can take a while; capture whatever rendered on timeout,
              // exactly as the in-process path does.
              try { await page.goto(url, { waitUntil: 'networkidle', timeout: 30000 }); }
              catch { /* timeout — screenshot what we have */ }
              // Unity WebGL games (the RL training cards): network-idle is the download
              // finishing, not the game drawing. Wait for the loader to hide, then past the
              // "Made with Unity" splash — the same wait as the in-process path.
              if (await page.$('#unity-canvas')) {
                await page.waitForFunction(() => document.getElementById('loading')?.style.display === 'none',
                  null, { timeout: 90000 }).catch(() => {});
                await page.waitForTimeout(6000);
              }
              writeFileSync(`shots/${host}.png`, await page.screenshot({ type: 'png' }));
              captured++;
            } catch (err) {
              console.log(`::warning title=Screenshot failed::${host}: ${err.message}`);
            } finally {
              await page.close();
            }
          }
          await browser.close();

          console.log(`captured ${captured}/${targets.length}`);
          // A run that captured nothing is a failure worth seeing; partial success is normal
          // (an app can be genuinely down on any given night).
          if (captured === 0) { console.log('::error title=No screenshots captured::every target failed'); process.exit(1); }
          EOF
          node capture.mjs

      # Lighthouse scores for the card chips, from Google's hosted PageSpeed Insights rather
      # than a local Lighthouse run: no Chrome flags to tune, and the number matches what
      # anyone gets by pasting the URL into pagespeed.web.dev. Runs after the capture pass on
      # purpose — that pass has just woken every F1 app, so this measures the app, not its
      # cold start. PAGESPEED_API_KEY is optional; anonymous calls work at this volume but
      # share a tighter quota. Never fails the job: screenshots matter more than scores.
      - name: PageSpeed Insights
        continue-on-error: true
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: |
          cat > pagespeed.mjs <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';

          const targets = JSON.parse(readFileSync('targets.json', 'utf8'));
          const categories = ['performance', 'accessibility', 'best-practices', 'seo'];
          const scores = {};
          for (const { host, url } of targets) {
            const q = new URLSearchParams({ url, strategy: 'mobile' });
            for (const c of categories) q.append('category', c);
            if (process.env.PAGESPEED_API_KEY) q.set('key', process.env.PAGESPEED_API_KEY);
            try {
              const res = await fetch(`https://www.googleapis.com/pagespeedonline/v5/runPagespeed?${q}`,
                { signal: AbortSignal.timeout(90000) });
              if (!res.ok) { console.log(`::warning title=PageSpeed failed::${host}: HTTP ${res.status}`); continue; }
              const cats = (await res.json()).lighthouseResult?.categories ?? {};
              // A category that errored has score null. Skip the host rather than print a 0
              // that reads as "terrible" when it means "not measured".
              if (categories.some(c => typeof cats[c]?.score !== 'number')) {
                console.log(`::warning title=PageSpeed incomplete::${host}`);
                continue;
              }
              const pct = c => Math.round(cats[c].score * 100);
              scores[host] = {
                performance: pct('performance'),
                accessibility: pct('accessibility'),
                bestPractices: pct('best-practices'),
                seo: pct('seo'),
              };
              console.log(`${host}: ${JSON.stringify(scores[host])}`);
            } catch (err) {
              console.log(`::warning title=PageSpeed failed::${host}: ${err.message}`);
            }
          }
          writeFileSync('lighthouse.json', JSON.stringify({ generatedAt: new Date().toISOString(), scores }));
          console.log(`scored ${Object.keys(scores).length}/${targets.length}`);
          EOF
          node pagespeed.mjs

      - name: Azure Login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload to blob storage
        run: |
          # Resolved at run time rather than held as a secret: it is never stored anywhere,
          # and it follows the account if the key is rotated. Not echoed, and the upload runs
          # with --output none so no URL list lands in the log.
          ACCOUNT_KEY=$(az storage account keys list \
            --account-name "$STORAGE_ACCOUNT" \
            --resource-group "$STORAGE_RG" \
            --query "[0].value" -o tsv)
          if [ -z "$ACCOUNT_KEY" ]; then
            echo "::error title=No storage key::The OIDC identity cannot listKeys on $STORAGE_ACCOUNT — it needs Contributor on $STORAGE_RG."
            exit 1
          fi

          az storage blob upload-batch \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$ACCOUNT_KEY" \
            --destination "$CONTAINER" \
            --source shots \
            --content-type "image/png" \
            --overwrite true \
            --output none

          echo "Uploaded $(ls shots | wc -l) screenshots to $CONTAINER."

          # Scores MERGE into last night's file rather than replacing it: an app PageSpeed
          # could not reach tonight keeps yesterday's numbers instead of losing its chips.
          # Same container, so AppScreenshotService reads it with the credential it already has.
          if [ -f lighthouse.json ]; then
            az storage blob download --account-name "$STORAGE_ACCOUNT" --account-key "$ACCOUNT_KEY" \
              --container-name "$CONTAINER" --name lighthouse.json --file previous.json --output none 2>/dev/null \
              || echo '{}' > previous.json
            jq -s '{generatedAt: .[1].generatedAt, scores: ((.[0].scores // {}) + .[1].scores)}' \
              previous.json lighthouse.json > merged.json
            az storage blob upload --account-name "$STORAGE_ACCOUNT" --account-key "$ACCOUNT_KEY" \
              --container-name "$CONTAINER" --name lighthouse.json --file merged.json \
              --content-type "application/json" --overwrite true --output none
            echo "Uploaded PageSpeed scores for $(jq '.scores | length' merged.json) hosts."
          fi

      # A Lighthouse regression is the one alert the app cannot send for itself: the scores
      # are produced here, nightly, and the previous night's file is only on hand right now.
      # Same ntfy topic as AlertNotifier. NTFY_TOPIC is an optional secret; without it the
      # step tries the app's own Key Vault secret, and without either it is a no-op.
      - name: Alert on Lighthouse drops
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -f previous.json ] && [ -f lighthouse.json ] || exit 0
          TOPIC="${NTFY_TOPIC:-$(az keyvault secret show --vault-name kv-poshared2 \
            --name PoPunkouterSoftware--Alerts--NtfyTopic --query value -o tsv 2>/dev/null || true)}"
          [ -n "$TOPIC" ] || { echo "No ntfy topic available — skipping."; exit 0; }
          echo "::add-mask::$TOPIC"
          # ponytail: 15 points, because PageSpeed's own run-to-run noise is ~5-10 on
          # performance. Per-category thresholds if this proves too quiet or too chatty.
          jq -r --argjson min 15 -s '
            (.[0].scores // {}) as $old | (.[1].scores // {}) as $new
            | $new | to_entries[] | .key as $host | select($old[$host])
            | [ .value | to_entries[] | select(($old[$host][.key] // .value) - .value >= $min)
                | "\(.key) \($old[$host][.key])→\(.value)" ]
            | select(length > 0) | "\($host): \(join(", "))"' previous.json lighthouse.json > drops.txt
          [ -s drops.txt ] || { echo "No score dropped by 15+ points."; exit 0; }
          cat drops.txt
          jq -n --arg topic "$TOPIC" --rawfile body drops.txt --arg click "$SITE_URL/" \
            '{topic: $topic, title: "Lighthouse scores dropped", message: $body, priority: 3, tags: ["chart_with_downwards_trend"], click: $click}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' --data-binary @- https://ntfy.sh/ > /dev/null
