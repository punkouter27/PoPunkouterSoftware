name: Deploy to Azure App Service

# Trigger only on push to master and manual dispatch.
# This is the only workflow in this repo: it builds and deploys to Azure App Service.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Cancel in-progress runs of the same workflow on the same ref.
concurrency:
  group: deploy-popunkoutersoftware-${{ github.ref }}
  cancel-in-progress: true

# Minimum scopes for OIDC deployment; everything else is denied.
permissions:
  id-token: write
  contents: read

# Repository variables, set by SCRIPTS/ensure-azure-access.ps1 (none of them is a secret):
#   AZURE_CLIENT_ID            — the gh-popunkoutersoftware-deploy OIDC app
#   AZURE_TENANT_ID
#   AZURE_SUBSCRIPTION_ID
#   AZURE_WEBAPP_NAME          (optional) — App Service name.
#                              Falls back to the known production app if unset.
#   AZURE_RESOURCE_GROUP       (variable, optional) — falls back to PoPunkouterSoftware.
#   AZURE_WEBAPP_SLOT          (variable, optional) — default 'production'
env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'
  # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 keeps Azure actions on the maintained Node 24 runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # The live production targets. Used as the fallback when the matching
  # "production" environment variables are unset or misconfigured, so the
  # pipeline deploys to the right resource even without the GitHub vars.
  DEFAULT_APP_NAME: 'app-popunkoutersoftware2'
  DEFAULT_RESOURCE_GROUP: 'PoPunkouterSoftware'

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pin to the production environment so its protection rules / approval gates apply.
    environment: production
    steps:
      # Resolve the deploy targets once: prefer the production environment vars,
      # fall back to the known live resources. A warning (not a hard failure) is
      # emitted when a var is missing so the deploy still proceeds correctly.
      - name: Resolve deploy targets
        id: targets
        run: |
          APP_NAME="${{ vars.AZURE_WEBAPP_NAME || env.DEFAULT_APP_NAME }}"
          RG="${{ vars.AZURE_RESOURCE_GROUP || env.DEFAULT_RESOURCE_GROUP }}"
          if [ -z "${{ vars.AZURE_WEBAPP_NAME }}" ]; then
            echo "::warning title=AZURE_WEBAPP_NAME unset::Using fallback app name '$APP_NAME'. Set AZURE_WEBAPP_NAME in Settings → Environments → production → Variables to make this explicit."
          fi
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "resource_group=$RG" >> "$GITHUB_OUTPUT"
          echo "Deploying '$APP_NAME' in resource group '$RG'."

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0   # full history so MinVer can compute the version from tags

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore PoPunkouterSoftware.sln --nologo

      - name: Build
        run: dotnet build PoPunkouterSoftware.sln -c Release --no-restore --nologo

      # ONE test tier runs here, and only one.
      #
      # Unit is the only tier that is hermetic enough to belong in a deploy pipeline: no
      # Docker, no network, no live host, ~0.5s for 100 tests against an assembly this job
      # has already built. Integration needs a Testcontainers Azurite instance; E2E-API and
      # E2E-UI need a running app (and E2E-UI a browser download) and are pointed at a
      # BASE_URL by hand. Adding any of those would trade a fast gate for a slow, flaky one
      # and start blocking deploys on infrastructure rather than on code.
      #
      # This pipeline was build-and-deploy only until 2026-09-05, on the reasoning that the
      # fast tier runs locally before every push. That holds right up until the once it
      # does not, and the cost of the guard turned out to be under a second.
      - name: Unit tests
        run: dotnet test tests/PoPunkouterSoftware.Unit -c Release --no-build --nologo

      - name: Publish
        run: dotnet publish src/PoPunkouterSoftware.API/PoPunkouterSoftware.API.csproj -c Release --no-restore -o ./publish --nologo

      # NOTE: 'secrets' is intentionally NOT referenced in any 'if:' expression —
      # GitHub Actions blocks it there to avoid leaking secret existence.
      # azure/login will fail with a clear error if the production environment
      # is misconfigured (missing AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID).
      - name: Azure Login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Same step in every Po web repo. F1 gives the app about 60 CPU-minutes a day; once spent, Azure stops the
      # site (usageState Exceeded) until 00:00 UTC and refuses the package with a bare 403. Say what it is.
      - name: Check the F1 daily CPU quota
        run: |
          usage=$(az webapp show -g "${{ github.event.repository.name }}" -n "${{ vars.AZURE_WEBAPP_NAME }}" --query usageState -o tsv)
          if [ "$usage" = "Exceeded" ]; then
            echo "::error::${{ vars.AZURE_WEBAPP_NAME }} has used up its F1 daily CPU quota, so Azure refuses the package until 00:00 UTC. Rerun after that."
            exit 1
          fi

      # Infrastructure is provisioned out-of-band (infra/main.bicep, applied
      # locally or by a separately-privileged infra workflow) — deliberately NOT
      # here. That keeps this deploy identity scoped to website-publish only,
      # rather than the resource-group Contributor that provisioning requires.
      #
      # NOTE: azure/webapps-deploy (OneDeploy) started returning HTTP 500 from the
      # App Service intake API on 2026-07-10 across three consecutive runs, while
      # the site and Kudu stayed healthy. The legacy Kudu zipdeploy path is a
      # separate endpoint and unaffected, so deploy through it via the CLI.
      - name: Zip publish output
        run: cd publish && zip -qr ../deploy.zip .

      # The site as it is right now, so a release that fails the smoke test below can be put
      # back. Kudu's zip API with the same OIDC identity — Contributor on the resource group
      # covers SCM access — so no publish profile and no new secret. A failed backup (first
      # deploy, SCM briefly unavailable) is a warning: it costs the rollback, not the deploy.
      - name: Back up the live site
        id: backup
        run: |
          TOKEN=$(az account get-access-token --query accessToken -o tsv)
          if curl -fsS --max-time 300 -H "Authorization: Bearer $TOKEN" -o previous.zip \
               "https://${{ steps.targets.outputs.app_name }}.scm.azurewebsites.net/api/zip/site/wwwroot/" \
             && [ -s previous.zip ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Backed up $(du -h previous.zip | cut -f1) of the live site."
          else
            echo "::warning title=No backup::Could not download the live site — this deploy cannot be rolled back automatically."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Azure App Service (zipdeploy)
        run: |
          az webapp deployment source config-zip \
            --resource-group "${{ steps.targets.outputs.resource_group }}" \
            --name "${{ steps.targets.outputs.app_name }}" \
            --src deploy.zip \
            --timeout 600

      # A green deploy step proves the zip was accepted, not that the app starts. Three
      # checks a broken release fails: liveness (/healthz), the deep probe (/health answers
      # 200 even when degraded — a 5xx means the pipeline itself is broken), and the
      # first-paint contract /azure renders from. Generous retries: F1 cold-starts slowly.
      - name: Smoke test
        id: smoke
        run: |
          HOST=$(az webapp show --resource-group "${{ steps.targets.outputs.resource_group }}" \
            --name "${{ steps.targets.outputs.app_name }}" --query defaultHostName -o tsv)
          BASE="https://$HOST"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          check() {
            for i in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$BASE$1" || echo 000)
              case " $2 " in *" $code "*) echo "$1 -> $code"; return 0;; esac
              echo "$1 -> $code (attempt $i)"; sleep 15
            done
            echo "::error title=Smoke test failed::$1 never answered $2"; return 1
          }
          check /health/live 200
          check /health 200
          # 404 is a legitimate answer before the first scan has ever run.
          check /api/diag/summary "200 404"

      # Same gate in every Po web repo: the new build is the one answering (X-Commit on /health/live is this
      # commit, not the old instance still serving), then its dependencies answer (/health).
      - name: Health gate (this commit on /health/live, then /health)
        id: gate
        shell: bash
        run: |
          base="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          for attempt in $(seq 1 60); do
            commit=$(curl -s -D - -o /dev/null --max-time 30 "$base/health/live" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-commit" {print $2}')
            [ "$commit" = "$GITHUB_SHA" ] && { echo "/health/live serves $GITHUB_SHA (attempt $attempt)"; break; }
            [ "$attempt" = "60" ] && { echo "::error::/health/live still serves ${commit:-no X-Commit header}, not $GITHUB_SHA"; exit 1; }
            sleep 15
          done
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$base/health" || echo 000)
            [ "$code" = "200" ] && { echo "/health -> 200 (attempt $attempt)"; exit 0; }
            sleep 15
          done
          echo "::error::/health never returned 200 (last: $code)"; exit 1

      - name: Roll back
        if: failure() && (steps.smoke.conclusion == 'failure' || steps.gate.conclusion == 'failure') && steps.backup.outputs.ok == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          az webapp deployment source config-zip \
            --resource-group "${{ steps.targets.outputs.resource_group }}" \
            --name "${{ steps.targets.outputs.app_name }}" \
            --src previous.zip \
            --timeout 600
          echo "::error title=Rolled back::${{ github.sha }} failed its smoke test; the previous build is live again."
          # Same ntfy topic as AlertNotifier: optional NTFY_TOPIC secret, else the app's own
          # Key Vault secret, else no push (the red workflow still emails).
          TOPIC="${NTFY_TOPIC:-$(az keyvault secret show --vault-name kv-poshared2 \
            --name PoPunkouterSoftware--Alerts--NtfyTopic --query value -o tsv 2>/dev/null || true)}"
          if [ -n "$TOPIC" ]; then
            echo "::add-mask::$TOPIC"
            jq -n --arg topic "$TOPIC" --arg sha "${GITHUB_SHA::7}" \
              --arg click "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              '{topic: $topic, title: "Deploy rolled back", message: "\($sha) failed its smoke test; the previous build is live again.", priority: 4, tags: ["rewind"], click: $click}' \
              | curl -fsS -X POST -H 'Content-Type: application/json' --data-binary @- https://ntfy.sh/ > /dev/null || true
          fi
