name: Po conventions

# Weekly: every Po repo still follows the shared "CI/CD and Azure" conventions (SCRIPTS/check-conventions.sh).
# A gap turns this run red, and the CI watcher pushes that to ntfy like any other red run.
on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}   # every Po repo is public, so the default token can read them
    steps:
      - uses: actions/checkout@v4
      - name: Check every Po repo
        run: bash SCRIPTS/check-conventions.sh
