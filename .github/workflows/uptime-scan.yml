name: Nightly uptime scan

# Guarantees the /azure uptime grid gets one data point per day.
#
# WHY THIS EXISTS: nothing in the app schedules a full Azure scan. A scan runs only on a
# manual "Rescan Azure" click or when a visitor loads a stale portfolio (>12h), so on a day
# with no traffic the grid would have a blank column. The background pinger fills days in too,
# but it stops with the app — the F1 plan has no Always-On and unloads the site when idle.
# An external trigger is the only thing that works when nobody is looking.
#
# This also wakes the site, which restarts the pinger for a while as a side benefit.
#
# Deliberately separate from deploy.yml, which is build-and-deploy only by design.
on:
  schedule:
    # 06:17 UTC — an off-the-hour minute, so this does not pile onto the top-of-hour
    # surge that GitHub's scheduler queues (and delays) worst.
    - cron: '17 6 * * *'
  workflow_dispatch:

# Never let two scans overlap: the server answers the second with 409 anyway, but queueing
# runs to find that out is pure waste.
concurrency:
  group: uptime-scan
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_URL: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      # Dead-man's switch. This workflow ran red every night for a week and nobody noticed,
      # because a red scheduled run emails nobody by default. healthchecks.io emails when a
      # /fail ping arrives OR when no ping arrives at all (runner never started, workflow
      # disabled after 60 days of repo inactivity). Optional: unset means the step is skipped.
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
    steps:
      # F1 cold start: the site may be unloaded and take tens of seconds to answer. Wake it
      # before asking it to do real work, so the refresh call is not the request that eats
      # the cold start and times out.
      - name: Wake the site
        run: |
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$APP_URL/healthz" || echo 000)
            echo "attempt $attempt -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::Site never became reachable at $APP_URL/healthz"
          exit 1

      - name: Trigger the Azure rescan
        env:
          MANAGEMENT_KEY: ${{ secrets.MANAGEMENT_API_KEY }}
        run: |
          if [ -z "$MANAGEMENT_KEY" ]; then
            echo "::error::MANAGEMENT_API_KEY secret is not set. The endpoint is gated by"
            echo "::error::ManagementActionFilter and will reject this request."
            exit 1
          fi

          code=$(curl -s -o /tmp/body.json -w '%{http_code}' --max-time 120 \
            -X POST "$APP_URL/api/diag/refresh" \
            -H "X-Management-Key: $MANAGEMENT_KEY")
          echo "refresh -> HTTP $code"
          cat /tmp/body.json 2>/dev/null || true
          echo

          case "$code" in
            202) echo "Scan accepted." ;;
            # A scan already running is a success for our purposes: the day gets its data
            # point either way, and failing the run would page a human over a race.
            409) echo "::notice::A refresh was already in progress — that satisfies today's scan." ;;
            403) echo "::error::Rejected. Production needs FeatureFlags:EnableManagementActions=true AND Security:ManagementApiKey set."; exit 1 ;;
            401) echo "::error::MANAGEMENT_API_KEY does not match Security:ManagementApiKey on the server."; exit 1 ;;
            *)   echo "::error::Unexpected response $code"; exit 1 ;;
          esac

      # The refresh returns 202 immediately and scans in the background, so a green step above
      # only proves it started. Confirm a report actually landed, otherwise a scan that fails
      # every night looks like a passing workflow forever.
      - name: Confirm a fresh report landed
        run: |
          # One self-contained probe: fetch the summary, print the report's age in seconds.
          # 999999 stands in for "no report / unparseable", so the caller only compares numbers.
          age_script='import json,sys,urllib.request,datetime
          try:
              with urllib.request.urlopen(sys.argv[1], timeout=60) as r:
                  raw = (json.load(r).get("generatedAt") or "").rstrip("Z").split(".")[0]
              at = datetime.datetime.fromisoformat(raw)
              print(int((datetime.datetime.utcnow() - at).total_seconds()))
          except Exception:
              print(999999)'

          for attempt in $(seq 1 20); do
            sleep 30
            age=$(python3 -c "$age_script" "$APP_URL/api/diag/summary" || echo 999999)
            echo "attempt $attempt -> report age ${age}s"
            if [ "$age" -lt 1800 ]; then
              echo "Fresh report confirmed (${age}s old)."
              exit 0
            fi
          done
          echo "::error::No fresh report appeared within 10 minutes of triggering the scan."
          exit 1

      # Last, and always(): a failed step above must still report, or the switch only ever
      # hears about successes. `!= 'success' && '/fail' || ''` and not the reverse — in an
      # expression '' is falsy, so `== 'success' && '' || '/fail'` would ALWAYS append /fail.
      - name: Report to healthchecks.io
        if: always() && env.HEALTHCHECKS_PING_URL != ''
        run: curl -fsS -m 10 --retry 3 -o /dev/null "${HEALTHCHECKS_PING_URL}${{ job.status != 'success' && '/fail' || '' }}"
